<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:var(--sapBackgroundColor);} .pv{padding:1rem;display:flex;flex-direction:column;gap:1rem;font-family:var(--font-sans);font-size:.875rem;color:var(--sapTextColor)} .pv.fh-row{flex-direction:row;flex-wrap:wrap;align-items:center} .pv-cap{color:var(--sapContent_LabelColor);font-size:.75rem;margin-bottom:.25rem}</style>
</head>
<body>
<div class="fh-app">
<header class="fh-shellbar">
  <button class="fh-shellbar__action" aria-label="Menu"><span class="fh-icon" data-icon="menu2"></span></button>
  <span class="fh-shellbar__title">Procurement</span>
  <span class="fh-shellbar__secondary">Manage Purchase Orders</span>
  <span class="fh-shellbar__spacer"></span>
  <label class="fh-shellbar__search"><span class="fh-icon" data-icon="search"></span><input placeholder="Search in Purchase Orders"></label>
  <button class="fh-shellbar__action" aria-label="Notifications"><span class="fh-icon" data-icon="bell"></span><span class="fh-shellbar__badge">3</span></button>
  <button class="fh-shellbar__action" aria-label="Help"><span class="fh-icon" data-icon="sys-help"></span></button>
  <button class="fh-shellbar__action" aria-label="My apps"><span class="fh-icon" data-icon="grid"></span></button>
  <span class="fh-avatar fh-avatar--xs fh-avatar--accent6" style="margin-left:.25rem">JW</span>
</header></div>
<script type="module">
// SAP icons (Horizon set "SAP-icons-v5") as SVG path data from @ui5/webcomponents-icons, pinned.
const V = "2.9.0";
await Promise.all([...document.querySelectorAll("[data-icon]")].map(async (el) => {
  try {
    const m = await import(`https://cdn.jsdelivr.net/npm/@ui5/webcomponents-icons@${V}/dist/v5/${el.dataset.icon}.js/+esm`);
    const d = Array.isArray(m.pathData) ? m.pathData : [m.pathData];
    el.innerHTML = `<svg viewBox="0 0 512 512" aria-hidden="true">${d.map((p) => `<path d="${p}"/>`).join("")}</svg>`;
  } catch (e) { /* icon unavailable: the empty 1rem box keeps layout */ }
}));
</script>
</body>
</html>
